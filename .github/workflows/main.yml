name: Build, Tag & Deploy Node.js Project

# Trigger this workflow on pushes to tags matching the pattern 'v*.*.*'.
on:
  push:
    tags:
      - 'v*.*.*'  # Adjust the pattern to match your versioning scheme

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: backend  # Set your ECR repository name here.
      AWS_REGION: sa-east-1    # AWS region—update if needed.

    steps:
      # Step 1: Checkout the repository.
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      # Step 3: Install dependencies.
      - name: Install dependencies
        run: yarn install

      # Step 4: Run tests (optional).
      # Uncomment the following step if you have tests to run.
      # - name: Run tests
      #   run: yarn test

      # Step 5: Build the project.
      - name: Build project
        run: yarn run build

      # Step 6: Extract version from the Git tag 
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      # Step 7: Configure AWS credentials using repository secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 8: Login to Amazon ECR.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Step 9: Build, tag, and push the Docker image to ECR.
      - name: Build, tag, and push Docker image
        run: |
          REPO_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          echo "Building image with tag: $VERSION"
          docker build -t $REPO_URI:$VERSION -f ./registry/production/Dockerfile .
          # Also tag the image as "latest"
          docker tag $REPO_URI:$VERSION $REPO_URI:latest
          echo "Pushing image tags..."
          docker push $REPO_URI:$VERSION
          docker push $REPO_URI:latest
          
      # Step 10: Deploy image to EC2
      - name: Deploy to EC2
        run: |
          echo "Deploying to EC2..."
          echo "${SSH_PRIVATE_KEY}" > private_key.pem
          chmod 600 private_key.pem

          ssh -o StrictHostKeyChecking=no -i private_key.pem $EC2_USER@$EC2_HOST << 'EOF'
            set -e

            echo "Checking for AWS CLI..."
            if ! command -v aws &> /dev/null; then
              echo "AWS CLI not found. Installing..."
              sudo apt-get update -y
              sudo apt-get install -y unzip curl
              curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
              unzip awscliv2.zip
              sudo ./aws/install
              rm -rf aws awscliv2.zip
            else
              echo "AWS CLI is already installed."
            fi

            echo "Logging into Amazon ECR..."
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $(aws sts get-caller-identity --query 'Account' --output text).dkr.ecr.$AWS_REGION.amazonaws.com

            echo "Pulling latest Docker image..."
            cd $DOCKER_COMPOSE_DIR
            docker-compose pull

            echo "Restarting services..."
            docker-compose down
            docker-compose up -d

            echo "Deployment completed!"
          EOF

          rm -f private_key.pem