name: Build, Tag & Deploy Node.js Project

# Trigger this workflow on pushes to "staging" or "main" branches.
on:
  push:
    branches:
      - staging
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Set your ECR repository name here.
      ECR_REPOSITORY: backend
      # AWS region—update if needed.
      AWS_REGION: sa-east-1

    steps:
      # Step 1: Checkout the repository.
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js.
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install dependencies.
      - name: Install dependencies
        run: npm install

      # Step 4: Run tests.
      - name: Run tests
        run: npm test

      # Step 5: Build the project.
      - name: Build project
        run: npm run build

      # Step 6: On the main branch only, bump version (patch), create a Git tag, and push it.
      - name: Bump version and push tag
        if: github.ref == 'refs/heads/main'
        run: |
          npm version patch -m "chore(release): %s"
          git push origin HEAD --follow-tags

      # Step 7: Capture the current version from package.json for use as the Docker tag.
      - name: Get project version
        id: get_version
        run: echo "VERSION=$(node -p \"require('./package.json').version\")" >> $GITHUB_OUTPUT

      # Step 8: Configure AWS credentials using repository secrets.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Step 9: Login to Amazon ECR.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      # Step 10: Build, tag, and push the Docker image to ECR.
      - name: Build, tag and push Docker image
        run: |
          IMAGE_VERSION=${{ steps.get_version.outputs.VERSION }}
          REPO_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
          echo "Building image with tag: $IMAGE_VERSION"
          docker build -t $REPO_URI:$IMAGE_VERSION .
          # Also tag the image as "latest"
          docker tag $REPO_URI:$IMAGE_VERSION $REPO_URI:latest
          echo "Pushing image tags..."
          docker push $REPO_URI:$IMAGE_VERSION
          docker push $REPO_URI:latest
